services:
  
    app:
        container_name: fast_api
        build:
            context: .
            dockerfile: Dockerfile
        ports:
          - 8000:8000
        env_file:
            - .env
        depends_on:
            - db
    
    db:
        image: postgres:18
        container_name: postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
          - 5432:5432
        volumes:
          - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: